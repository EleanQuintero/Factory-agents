schema: spec-driven

context: |
  Tech stack: Mastra AI Framework v1.15.0, TypeScript 5, Next.js 16, React 19, Tailwind CSS 4, Zod 4, pnpm
  Architecture: Turborepo monorepo (apps/api, apps/web, packages/mastra-client)
  Agents: Weather (gemini-2.5-flash-lite), Search (gemini-2.5-flash via Tavily MCP), Notion orchestrator (multi-agent, gemini-2.5-flash)
  Integrations: @composio/core 0.6.6 + @composio/mastra 0.6.6 (installed, not yet used)
  Testing: None configured yet
  Style: ESLint (eslint-config-next), Tailwind CSS 4 with PostCSS
  Database: PostgreSQL via @mastra/pg for Mastra storage
  Critical paths: apps/api/src/mastra/ (agents, tools, workflows, mcp, storage)

project_guidelines:
  source: "CLAUDE.md"
  critical_paths:
    - "apps/api/src/mastra/" # Mastra agents, tools, workflows, storage
    - "apps/web/src/" # Next.js frontend
    - "packages/mastra-client/" # Shared client package
  code_practices:
    - "Load Mastra skill before any Mastra work"
    - "Follow Mastra conventions for agents/tools/workflows"
    - "Use supervisor pattern (not .network()) for multi-agent coordination"
    - "NO ZodIntersection types — Gemini models reject them"
  build_rules:
    - "Use pnpm as package manager"
    - "Turborepo for monorepo orchestration"

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Document architecture decisions with rationale
    - Follow existing patterns in codebase
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - MUST follow code practices from project guidelines
  verify:
    - Compare implementation against every spec scenario
    - Verify builds pass for all packages
