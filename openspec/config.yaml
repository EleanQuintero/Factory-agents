schema: spec-driven

context: |
  Tech stack: Next.js 16.1.6, React 19.2.3, Mastra AI Framework, TypeScript 5, Tailwind CSS 4, pnpm
  Architecture: Monolith Next.js + Mastra → Migrating to Turborepo monorepo (apps/api + apps/web + packages/mastra-client)
  Testing: None configured yet
  Style: ESLint (eslint-config-next), Tailwind CSS 4 with PostCSS
  Database: LibSQL (mastra.db) for Mastra storage
  Critical paths: src/mastra/ (agents, tools, workflows), src/app/ (Next.js routes), src/components/ (UI)

project_guidelines:
  source: "CLAUDE.md"
  critical_paths:
    - "src/mastra/" # Mastra agents, tools, workflows
    - "src/app/" # Next.js app router pages and API routes
    - "src/components/" # UI components (shadcn + ai-elements)
    - "src/lib/" # Utilities
  code_practices:
    - "Load Mastra skill before any Mastra work"
    - "Follow Mastra conventions for agents/tools/workflows"
  build_rules:
    - "Use pnpm as package manager"
    - "Turborepo for monorepo orchestration"

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Document architecture decisions with rationale
    - Follow existing patterns in codebase
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - MUST follow code practices from project guidelines
  verify:
    - Compare implementation against every spec scenario
    - Verify builds pass for all packages
